<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Twin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='5' fill='%2322d3ee'/%3E%3Cpath d='M9 23V12h6v11M17 23V8h6v15' stroke='%230b1220' stroke-width='2.4' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="twin.css">
</head>
<body data-module="office">
<header>
  <h1>Office Twin <span>· Lahore Twin, phase 1</span></h1>
  <div class="clock num" id="clock">07:00</div>
  <button class="btn" id="play" aria-label="Play">▶ Play</button>
  <select id="speed" aria-label="Playback speed">
    <option value="10">10×</option>
    <option value="60" selected>60×</option>
    <option value="300">300×</option>
    <option value="900">900×</option>
  </select>
  <div class="seg" id="modes" role="group" aria-label="Rule set">
    <button data-mode="schedule" aria-pressed="false" title="Lights and AC on 08:30–18:30 everywhere">Fixed schedule</button>
    <button data-mode="pir" aria-pressed="false" title="Rooms follow motion sensors">Motion</button>
    <button data-mode="pir+co2" aria-pressed="true" title="Motion, and CO₂ confirms a room is really empty">Motion + CO₂</button>
  </div>
  <div class="seg" id="floors" role="group" aria-label="Floor"></div>
  <div class="spacer"></div>
  <a class="btn xlink" href="index.html" style="text-decoration:none">All modules</a>
  <a class="btn xlink" href="home.html" style="text-decoration:none">Home</a>
  <a class="btn xlink" href="hospital.html" style="text-decoration:none">Hospital</a>
  <button class="btn" id="about-btn" aria-label="About this module">About</button>
  <button class="btn" id="theme" aria-label="Toggle colour theme">Light</button>
</header>
<main>
  <section id="stage">
    <div class="layers seg" id="layers" role="group" aria-label="Map layer">
      <button data-layer="state" aria-pressed="true">Devices</button>
      <button data-layer="occ" aria-pressed="false">Occupancy</button>
      <button data-layer="temp" aria-pressed="false">Temperature</button>
      <button data-layer="co2" aria-pressed="false">CO₂</button>
    </div>
    <canvas id="plan" aria-label="Office floor plan"></canvas>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip"></div>
  </section>
  <aside>
    <div class="kpis">
      <div class="kpi big"><div class="v num" id="k-energy">0.0 kWh</div><div class="l" id="k-energy-l">Lights + AC so far today</div></div>
      <div class="kpi"><div class="v num" id="k-onsite">0</div><div class="l">People on site</div></div>
      <div class="kpi"><div class="v num" id="k-alerts">0</div><div class="l">Alerts so far</div></div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="events" aria-selected="true">Events</button>
      <button role="tab" data-tab="inspect" aria-selected="false">Inspector</button>
      <button role="tab" data-tab="attendance" aria-selected="false">Attendance</button>
      <button role="tab" data-tab="energy" aria-selected="false">Compare</button>
    </div>
    <div class="pane on" id="pane-events">
      <div class="filter"><label><input type="checkbox" id="only-alerts"> Alerts only</label><span class="spacer"></span><span id="log-count" class="num"></span></div>
      <ul class="log" id="log"></ul>
    </div>
    <div class="pane" id="pane-inspect">
      <label class="find"><span class="muted">Find</span><select id="find" aria-label="Find a person or room"></select></label>
      <div id="inspect-body"><p class="muted">Pick someone above, or click a room or a person on the plan, or an event in the log, to see what it is doing and why.</p></div>
    </div>
    <div class="pane" id="pane-attendance"></div>
    <div class="pane" id="pane-energy"></div>
  </aside>
</main>
<footer>
  <div class="timeline"><canvas id="tl"></canvas><input type="range" id="scrub" min="0" max="1" step="1" value="0" aria-label="Time of day"></div>
  <div class="ticks num" id="ticks"></div>
</footer>
<script>(function () { var q = new URLSearchParams(location.search).get("replay");
  var src = q && /^runs\/[\w.-]+\.js$/.test(q) ? q : "replay.js";
  document.write('<script src="' + src + '"><\/script>'); })();</script>
<script src="about.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
<script src="embed.js"></script>
</body>
</html>
