<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lahore Twin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%2322d3ee'/%3E%3Cpath d='M8 23V12l5-3v14M13 23V9l6 3v11M19 23v-8l5 2v6' stroke='%230b1220' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="twin.css">
<style>
body { grid-template-rows: 1fr; grid-template-columns: 232px 1fr; }
nav.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: auto; }
.brand { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.brand b { font-size: 17px; display: block; letter-spacing: .2px; }
.brand span { color: var(--muted); font-size: 12px; }
.navlist { list-style: none; margin: 8px 0; padding: 0 8px; flex: 1; }
.navlist button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: transparent; color: var(--muted); padding: 9px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 14px; }
.navlist button:hover { color: var(--text); background: var(--panel-2); }
.navlist button[aria-current="page"] { color: var(--text); background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
.navlist .ic { width: 22px; text-align: center; font-size: 15px; }
.navlist .tag { margin-left: auto; font-size: 10.5px; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; }
.side-foot { padding: 10px 12px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
#main { min-width: 0; min-height: 0; position: relative; overflow: auto; }
#frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
.overview { padding: 22px 26px 40px; max-width: 1180px; }
.overview h1 { font-size: 22px; margin: 0 0 4px; }
.overview .lead { color: var(--muted); margin: 0 0 20px; max-width: 780px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.card h2 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 10px; }
.card h2 .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--panel-2); color: var(--accent); font-size: 17px; }
.card p { margin: 0; color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stats div { background: var(--panel); padding: 8px 10px; }
.stats b { display: block; font-size: 17px; white-space: nowrap; }   /* "4:27 → 3:58" reads as one figure */
.stats span { font-size: 11.5px; color: var(--muted); }
.card .row-btns { display: flex; gap: 8px; margin-top: auto; }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.status { font-size: 11.5px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); margin-left: auto; font-weight: 500; }
.status.ready { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.status.building { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); max-width: 720px; width: calc(100% - 32px); padding: 0; box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
.dlg-body { padding: 18px 22px; max-height: 72vh; overflow: auto; }
.dlg-body h2 { margin: 0 0 8px; font-size: 18px; }
.dlg-body ul { margin: 4px 0 10px; padding-left: 20px; }
.dlg-body li { margin: 3px 0; font-size: 13.5px; }
.dlg-body td { vertical-align: top; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
.runform label { display: grid; grid-template-columns: 160px 1fr; gap: 10px; align-items: center; margin: 8px 0; font-size: 13.5px; }
.runform input, .runform select { width: 100%; }
input[type=number] { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px; }
.runmsg { font-size: 13px; margin-top: 8px; }
#demo-bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; display: none; align-items: center; gap: 14px;
  width: min(860px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--accent); border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow); }
body.demo-on #demo-bar { display: flex; }
#demo-bar .txt { flex: 1; min-width: 0; }
#demo-bar b { display: block; font-size: 14px; color: var(--accent); }
#demo-bar span { font-size: 13.5px; }
#demo-bar .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--alert); animation: blink 1.2s infinite; flex: none; }
@keyframes blink { 50% { opacity: .25; } }
@media (max-width: 860px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow: auto; height: auto; }
  nav.side { border-right: 0; border-bottom: 1px solid var(--line); }
  .navlist { display: flex; overflow-x: auto; gap: 4px; margin: 6px 0; }
  .navlist button { white-space: nowrap; }
  .navlist .tag { display: none; }
  #main { min-height: 80vh; }
  #frame { position: relative; height: 92vh; }
  .overview { padding: 16px; }
  .runform label { grid-template-columns: 1fr; gap: 4px; }
}
</style>
</head>
<body>
<nav class="side" aria-label="Modules">
  <div class="brand"><b>Lahore Twin</b><span>IoT simulation of a city, one building at a time</span></div>
  <ul class="navlist" id="nav"></ul>
  <div class="side-foot">
    <button class="btn primary" data-demo>▶ Watch the demo</button>
    <button class="btn" id="about-all">About</button>
    <button class="btn" id="theme" aria-label="Toggle colour theme">Light</button>
  </div>
</nav>
<section id="main">
  <div class="overview" id="overview"></div>
  <iframe id="frame" title="Module"></iframe>
</section>
<div id="demo-bar" role="status" aria-live="polite"><i class="dot" aria-hidden="true"></i><div class="txt"><b id="demo-title"></b><span id="demo-text"></span></div><button class="btn" id="demo-stop">Stop</button></div>
<dialog id="dlg"><div class="dlg-body" id="dlg-body"></div><div class="dlg-foot" id="dlg-foot"></div></dialog>
<script src="summary.js"></script>
<script src="about.js"></script>
<script src="shell.js"></script>
<script src="demo.js"></script>
</body>
</html>
